name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build fat jar
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar
      - name: Find jar
        run: |
          ls -la build/libs/
          cp build/libs/vibecraft.jar vibecraft.jar 2>/dev/null || \
          cp "$(ls build/libs/*.jar | grep -v plain | head -1)" vibecraft.jar
      - name: Create release + upload
        uses: softprops/action-gh-release@v2
        with:
          files: vibecraft.jar
          generate_release_notes: true
