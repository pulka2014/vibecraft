name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: chmod gradlew
        run: chmod +x gradlew
      - name: Build jar
        run: ./gradlew clean jar
      - name: Find jar
        run: |
          ls -la build/libs/
          cp "$(ls build/libs/*.jar | grep -v plain | head -1)" vibecraft.jar
      - name: Create release + upload
        uses: softprops/action-gh-release@v2
        with:
          files: vibecraft.jar
          generate_release_notes: true
