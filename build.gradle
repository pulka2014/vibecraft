plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.vibe.mc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.3'
    jomlVersion = '1.10.5'
    lwjglNatives = 'natives-linux'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.joml:joml:$jomlVersion"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
}

application {
    mainClass = 'com.vibe.mc.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// Записываем версию в ресурсы для чтения в рантайме
tasks.register('generateVersionFile') {
    def ver = project.version
    def outDir = layout.buildDirectory.dir("generated/resources/main").get().asFile
    doLast {
        outDir.mkdirs()
        new File(outDir, "version.txt").text = ver.toString()
    }
}
sourceSets.main.resources.srcDir("build/generated/resources/main")
tasks.named('processResources') { dependsOn 'generateVersionFile' }


// Убедиться, что манифест shadowJar указывает на Main
shadowJar {
    archiveBaseName.set('vibecraft')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': 'com.vibe.mc.Main'
    }
}
